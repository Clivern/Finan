[project]
name = "finan"
version = "0.1.0"
description = "Train language models from scratch, growing from notebook.ipynb"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "tiktoken>=0.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
